name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: ci
    # Only the private repo deploys; the public mirror just runs CI.
    if: github.repository == 'prajwalskandas31-sudo/pradeep-nadig-private-app'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pradeepnadig.in
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "bash -s -- $GITHUB_SHA" < scripts/deploy.sh

      - name: Public smoke check
        run: |
          for url in https://pradeepnadig.in/ https://pradeepnadig.in/api/v1/health https://pradeepnadig.in/sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            echo "$code $url"
            [ "$code" = "200" ] || exit 1
          done
